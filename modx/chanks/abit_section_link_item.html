<a class="help__card [+class+]" href="[+link+]">
    <span class="help__card-bg" aria-hidden="true"></span>
    <span class="help__card-glyph" aria-hidden="true">
        			[[svg_content? &svg=`[+icon_svg+]`]]
        		</span>
    <div class="help__card-code">[+num+]</div>
    <div class="help__card-title">[+title+]</div>
    <div class="help__card-go">Перейти <span class="arr">→</span></div>
</a>
